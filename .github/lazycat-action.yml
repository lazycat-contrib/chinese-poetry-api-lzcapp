version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.chinese-poetry-api.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: poetry-api

build:
  toolchains: []
  run_buildscript: false

images:
  - id: poetry-api
    target: service
    service: poetry-api
    source: docker.io/palemoky/chinese-poetry-api
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 诗泉
    summary: Published from GitHub Actions
