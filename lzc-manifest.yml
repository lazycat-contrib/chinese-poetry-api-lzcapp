application:
  subdomain: chinese-poetry-api
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://poetry-api:1279/

services:
  poetry-api:
    # upstream: docker.io/palemoky/chinese-poetry-api:0.6.1
    image: docker.1ms.run/palemoky/chinese-poetry-api:0.6.1
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/app/data

usage: |
  本应用提供 API 服务，打开应用后可访问统计接口。
  REST API 基础路径：/api/v1；健康检查：/api/v1/health；统计信息：/api/v1/stats；随机诗词：/api/v1/poems/random。
  GraphQL 接口：/graphql。完整文档：https://github.com/palemoky/chinese-poetry-api
